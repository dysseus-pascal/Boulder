name: Bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

# Schreiben darf nur der Release-Job - der Bau kommt mit Lesen aus.
permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    outputs:
      ver: ${{ steps.v.outputs.ver }}
    steps:
      # Gradle und die Hosttests laufen auf JDK 21: health-kmp 1.4.0 ist fuer Java 21 uebersetzt,
      # auf 17 scheitern Boulders Health-Tests mit UnsupportedClassVersionError. Die Module mit
      # Cores jvmToolchain(17) nehmen das JDK 17, das der Runner unter /usr/lib/jvm mitbringt.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('gradle/**', 'gradlew*', 'gradle.properties', '*.gradle*') }}
          restore-keys: gradle-
      - name: Version
        id: v
        run: echo "ver=$(cat BOULDER_VERSION)" >> "$GITHUB_OUTPUT"
      # Der Schluessel jedes Boulder-APK steht nicht im Repo: oeffentlich koennte sonst jeder ein
      # "Update" bauen, das Android ueber ein installiertes Boulder spielt. Der Fingerabdruck haelt
      # einen falschen Schluessel auf, dessen APK sich nicht als Update installieren liesse.
      - name: Fester Debug-Schlüssel
        env:
          KEYSTORE: ${{ secrets.BOULDER_APK_KEYSTORE }}
        run: |
          test -n "$KEYSTORE" || { echo "::error::Secret BOULDER_APK_KEYSTORE fehlt"; exit 1; }
          mkdir -p ~/.android
          printf '%s' "$KEYSTORE" | base64 -d > ~/.android/debug.keystore
          test "$(sha256sum < ~/.android/debug.keystore | cut -d' ' -f1)" = 8398e03d2140f1f3ad6082f933f1324a59e9684eee01db159acffbd29ff0d544 \
            || { echo "::error::BOULDER_APK_KEYSTORE ist nicht Boulders Schluessel"; exit 1; }
      - name: Tests
        # :server:test - der eigene Server ist ein JVM-Modul ohne jvmTest-Aufgabe.
        run: ./gradlew testDebugUnitTest testAndroidHostTest jvmTest :server:test
      - name: Bauen
        # Release-Build (R8, nicht debuggable), signiert mit dem festen Debug-Schluessel:
        # so installiert er sich als Update ueber jede bisherige Boulder-Fassung.
        # Der Runner hat 7 GB: ohne die Daemons der Tests, mit Kotlin im Gradle-Prozess und 3 GB
        # Heap kam R8 lokal mit 4,6 GB aus; daneben der Kotlin-Daemon der Tests war zu viel.
        run: |
          echo "LOCAL_RELEASE_BUILD=true" > local.properties
          ./gradlew --stop
          ./gradlew :androidApp:assembleRelease -Pkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs=-Xmx3g
      # Die Uebergabe an den Release-Job geht ueber den Cache des Repos, nicht als Artefakt:
      # Artefakte zaehlen zum Speicherkontingent des Kontos, und das blieb voll - die Laeufe 76
      # bis 79 scheiterten beim Hochladen, auch 15 h nachdem die alten APKs geloescht waren.
      # Das Buendel des eigenen Servers (server/LIESMICH.md) kommt mit ins Release. Immer: ob es ein
      # Release braucht, entscheidet der Release-Job erst nach den Tests (siehe dort).
      - name: APK und Server-Buendel fuer den Release-Job
        run: |
          mkdir -p apk && cp androidApp/build/outputs/apk/release/*.apk apk/
          ./gradlew :server:distTar
          cp "server/build/distributions/boulder-server-$(cat BOULDER_VERSION).tar.gz" apk/
      - uses: actions/cache/save@v4
        with:
          path: apk
          key: boulder-apk-${{ github.sha }}

  release:
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: apk
          key: boulder-apk-${{ github.sha }}
          fail-on-cache-miss: true
      # Ein Release entsteht hier, wenn sein Tag nach den Tests noch fehlt. Legte es jemand lokal an
      # (CLAUDE.md: lokaler Bau und gh release create), fehlt dort das Server-Buendel: es kommt dazu,
      # aber nur vom Stand, auf den der Tag zeigt - ein spaeterer Push derselben Fassung baut aus
      # anderem Code.
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${{ needs.android.outputs.ver }}"
          buendel="boulder-server-$ver.tar.gz"
          # Der Stand, auf den der Tag zeigt; leer ohne Tag (die API antwortet dann mit einem Fehler).
          tag="$(gh api "repos/$GITHUB_REPOSITORY/commits/v$ver" --jq .sha 2>/dev/null)" || tag=""
          if gh release view "v$ver" >/dev/null 2>&1; then
            namen="$(gh release view "v$ver" --json assets --jq '.assets[].name')"
            if [ "$tag" = "$GITHUB_SHA" ] && ! grep -x "$buendel" <<< "$namen" >/dev/null; then
              gh release upload "v$ver" "apk/$buendel"
            fi
          elif [ -z "$tag" ] || [ "$tag" = "$GITHUB_SHA" ]; then
            notes=".github/release/$ver.md"
            cp "$(ls apk/*.apk | head -n1)" boulder.apk
            gh release create "v$ver" boulder.apk "apk/$buendel" --target "$GITHUB_SHA" \
              --title "$ver - $(head -n1 "$notes")" --notes "$(tail -n +2 "$notes")"
          fi
