name: Bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

# Schreiben darf nur der Release-Job - der Bau kommt mit Lesen aus.
permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    outputs:
      ver: ${{ steps.v.outputs.ver }}
      neu: ${{ steps.v.outputs.neu }}
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('gradle/**', 'gradlew*', 'gradle.properties', '*.gradle*') }}
          restore-keys: gradle-
      - name: Version
        id: v
        run: |
          ver="$(cat BOULDER_VERSION)"
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "v$ver" >/dev/null; then echo "neu=nein" >> "$GITHUB_OUTPUT"; else echo "neu=ja" >> "$GITHUB_OUTPUT"; fi
      - name: Fester Debug-Schlüssel
        run: mkdir -p ~/.android && cp ci/debug.keystore ~/.android/debug.keystore
      - name: Tests
        run: ./gradlew :libpebble3:testAndroidHostTest :pebble:testAndroidHostTest :composeApp:testAndroidHostTest :util:testAndroidHostTest :androidApp:testDebugUnitTest
      - name: Bauen
        # Release-Build (R8, nicht debuggable), signiert mit dem festen Debug-Schluessel:
        # so installiert er sich als Update ueber jede bisherige Boulder-Fassung.
        run: |
          echo "LOCAL_RELEASE_BUILD=true" > local.properties
          ./gradlew :androidApp:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: boulder-apk
          path: androidApp/build/outputs/apk/release/*.apk
          if-no-files-found: error

  release:
    needs: android
    if: needs.android.outputs.neu == 'ja'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: boulder-apk
          path: apk
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${{ needs.android.outputs.ver }}"
          notes=".github/release/$ver.md"
          cp "$(ls apk/*.apk | head -n1)" boulder.apk
          gh release create "v$ver" boulder.apk --target "$GITHUB_SHA" \
            --title "$ver - $(head -n1 "$notes")" --notes "$(tail -n +2 "$notes")"
