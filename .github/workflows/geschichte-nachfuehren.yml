name: Geschichte nachfuehren

# Einmalig, von Hand gestartet, nachdem ci/debug.keystore aus der ganzen Geschichte entfernt ist:
# Die Zweige sind umgeschrieben, die Tags zeigen noch auf die alten Commits mit dem Schluessel.
# Der Workflow setzt jedes Tag auf seinen neuen Commit (.github/tags-neu.txt), ersetzt die alten
# Kennungen in den Releases und loescht die CI-Laeufe und Caches, die alte Kennungen tragen. Danach
# kommt er wieder aus dem Repo.

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  nachfuehren:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      # Mit allen Zweigen und Tags: Commits prueft git, das zaehlt nicht gegen die 1000 API-Aufrufe
      # pro Stunde, die der GITHUB_TOKEN hat.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Ein Tag umsetzen (PATCH mit force) verweigert GitHub dem GITHUB_TOKEN mit 403 (erster Lauf):
      # zwischen altem und neuem Commit liegen Aenderungen an Workflow-Dateien, und die Berechtigung
      # "workflows" kann er nicht bekommen. Loeschen und neu Anlegen darf er. Verliert ein Release
      # seinen Tag, wird es aber zum Entwurf; darum haengt es solange am Hilfstag "umzug-<tag>" auf
      # dem neuen Commit. Jeder Schritt richtet sich nach dem Stand, ein abgebrochener Lauf laesst
      # sich wiederholen.
      - name: Tags auf die neuen Commits
        run: |
          set -euo pipefail
          git ls-remote --tags origin > vorher.txt
          gh api --paginate "repos/$REPO/releases?per_page=100" \
            --jq '.[] | "\(.id) \(.tag_name) \(.target_commitish)"' > releases.txt
          # Ein abgebrochener Lauf kann das neueste Release am Hilfstag zuruecklassen.
          neuester=$(gh api "repos/$REPO/releases/latest" --jq .tag_name)
          neuester=${neuester#umzug-}
          n=0
          while read -r tag neu; do
            [ -n "$tag" ] || continue
            # Nur auf einen Commit ohne den Schluessel.
            git cat-file -e "$neu^{commit}"
            if [ -n "$(git ls-tree "$neu" -- ci/debug.keystore)" ]; then
              echo "::error::$tag: $neu traegt noch ci/debug.keystore"; exit 1
            fi
            hilf="umzug-$tag"
            ist=$(awk -v r="refs/tags/$tag" '$2 == r { print $1 }' vorher.txt)
            hilf_ist=$(awk -v r="refs/tags/$hilf" '$2 == r { print $1 }' vorher.txt)
            release=$(awk -v t="$tag" -v h="$hilf" '$2 == t || $2 == h' releases.txt)
            [ -n "$release" ] || { echo "::error::$tag: kein Release"; exit 1; }
            read -r id rtag ziel <<< "$release"
            latest=false
            if [ "$tag" = "$neuester" ]; then latest=true; fi
            # Eine Kennung als Ziel zeigt sonst weiter auf den alten Commit; "main" bleibt.
            felder=(-f tag_name="$tag" -f make_latest="$latest")
            if [[ "$ziel" =~ ^[0-9a-f]{40}$ ]]; then felder+=(-f target_commitish="$neu"); fi
            if [ "$ist" = "$neu" ] && [ "$rtag" = "$tag" ] && [ -z "$hilf_ist" ] \
              && { ! [[ "$ziel" =~ ^[0-9a-f]{40}$ ]] || [ "$ziel" = "$neu" ]; }; then
              continue
            fi
            if [ "$ist" != "$neu" ]; then
              if [ -z "$hilf_ist" ]; then
                gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/$hilf" -f sha="$neu" > /dev/null
                hilf_ist=$neu
              fi
              if [ "$rtag" != "$hilf" ]; then
                gh api -X PATCH "repos/$REPO/releases/$id" -f tag_name="$hilf" -f make_latest="$latest" > /dev/null
              fi
              if [ -n "$ist" ]; then
                gh api -X DELETE "repos/$REPO/git/refs/tags/$tag"
              fi
              gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$neu" > /dev/null
            fi
            gh api -X PATCH "repos/$REPO/releases/$id" "${felder[@]}" > /dev/null
            if [ -n "$hilf_ist" ]; then
              gh api -X DELETE "repos/$REPO/git/refs/tags/$hilf"
            fi
            n=$((n + 1))
          done < .github/tags-neu.txt
          echo "Tags umgesetzt: $n, neuestes Release: $neuester"

      - name: Alte CI-Laeufe und Caches loeschen
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/actions/runs?per_page=100" --jq '.workflow_runs[].id' > laeufe.txt
          while read -r lauf; do
            [ "$lauf" = "$GITHUB_RUN_ID" ] && continue
            gh api -X DELETE "repos/$REPO/actions/runs/$lauf" > /dev/null || echo "::warning::Lauf $lauf nicht geloescht"
          done < laeufe.txt
          gh api --paginate "repos/$REPO/actions/caches?per_page=100" --jq '.actions_caches[].id' > caches.txt
          while read -r cache; do
            gh api -X DELETE "repos/$REPO/actions/caches/$cache" > /dev/null || echo "::warning::Cache $cache nicht geloescht"
          done < caches.txt

      - name: Pruefen
        run: |
          set -euo pipefail
          git fetch -q --force --prune --prune-tags origin \
            '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          git ls-remote --heads --tags origin > nachher.txt
          fehler=0
          # Kein Zweig und kein Tag zeigt noch auf einen Stand mit dem Schluessel, kein Hilfstag bleibt.
          while read -r sha ref; do
            if [ -n "$(git ls-tree "$sha" -- ci/debug.keystore)" ]; then
              echo "::error::$ref zeigt auf $sha mit dem Schluessel"; fehler=1
            fi
            case "$ref" in refs/tags/umzug-*) echo "::error::Hilfstag $ref ist noch da"; fehler=1 ;; esac
          done < nachher.txt
          while read -r tag neu; do
            [ -n "$tag" ] || continue
            ist=$(awk -v r="refs/tags/$tag" '$2 == r { print $1 }' nachher.txt)
            if [ "$ist" != "$neu" ]; then echo "::error::$tag zeigt auf ${ist:-nichts} statt $neu"; fehler=1; fi
          done < .github/tags-neu.txt
          # Jedes Release ist veroeffentlicht, haengt an seinem Tag und zielt auf keinen alten Commit.
          gh api --paginate "repos/$REPO/releases?per_page=100" \
            --jq '.[] | "\(.tag_name) \(.draft) \(.target_commitish)"' > releases.txt
          while read -r tag entwurf ziel; do
            if [ "$entwurf" != false ] || [[ "$tag" == umzug-* ]]; then
              echo "::error::Release $tag: Entwurf $entwurf"; fehler=1
            fi
            if [[ "$ziel" =~ ^[0-9a-f]{40}$ ]] && [ -n "$(git ls-tree "$ziel" -- ci/debug.keystore 2> /dev/null)" ]; then
              echo "::error::Release $tag zielt auf $ziel mit dem Schluessel"; fehler=1
            fi
          done < releases.txt
          if ! neuester=$(gh api "repos/$REPO/releases/latest" --jq .tag_name) || [[ "$neuester" == umzug-* ]]; then
            echo "::error::Kein neuestes Release (${neuester:-})"; fehler=1
          fi
          echo "Geprueft: $(wc -l < nachher.txt) Verweise, $(wc -l < releases.txt) Releases, neuestes: ${neuester:-}"
          exit $fehler
