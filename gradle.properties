#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx6g
kotlin.native.jvmArgs=-Xmx12g
ksp.useKSP2=true
kotlin.apple.deprecated.allowUsingEmbedAndSignWithCocoaPodsDependencies=true

#Gradle
org.gradle.jvmargs=-Xmx4g
org.gradle.parallel=true
org.gradle.caching=true

#Android
kotlin.incremental.native=true
android.nonTransitiveRClass=true
android.useAndroidX=true
# AGP 9 rejects com.android.library/application alongside the KMP plugin unless these are off.
# Removing them means migrating every KMP module to com.android.kotlin.multiplatform.library.
android.builtInKotlin=false
android.newDsl=false
kotlin.mpp.enableCInteropCommonization=true

org.gradle.configuration-cache=true

bugUrl=
tokenUrl=
githubClientId=
githubClientSecret=
mixpanelToken=
wisprAuthUrl=
kirinkiUrl=
memfaultToken=
googleClientId=
googleAuthEnabled=true
appleAuthEnabled=true
githubAuthEnabled=true
cactusProKey=